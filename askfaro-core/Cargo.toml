# askfaro-core — the single on-device SDK core for Faro.
#
# ONE crate, ONE import; every capability is a cargo feature. This replaces the
# former per-capability crates (core-model/stt/search/generation/progressive) so
# consumers add a single git/crates.io dependency and switch capabilities on with
# features rather than juggling a fistful of packages:
#
#   askfaro-core = { git = "...", default-features = false, features = ["stt"] }
#
# Heavy/platform deps are pulled ONLY by the feature that needs them, so the
# default build stays light and cross-compiles unchanged:
#   - search        rusqlite (bundled FTS5 SQLite) + md5 bag-of-words embedder
#   - embeddinggemma  ort + tokenizers (the EmbeddingGemma vector embedder)
#   - stt           parakeet-rs (ONNX Runtime) for speech-to-text
#
# Public, MIT, askfaro-branded. Self-contained (explicit package fields) so it
# copies verbatim into the public poolside-ventures/askfaro-core repo.
[package]
name = "askfaro-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-device SDK core for Faro: model provisioning, embedded search, text generation + tool-calling, and progressive catalog selection. One crate, capabilities behind features."
repository = "https://github.com/poolside-ventures/askfaro-core"

[features]
# Light, broadly-useful defaults; heavy/platform capabilities are opt-in.
default = ["search", "generation", "progressive"]
# Shared model provisioning (sha256 spec + verify). Internal; pulled by stt/search.
model = ["dep:sha2", "dep:hex"]
# Embedded hybrid search (FTS5 lexical + bag-of-words semantic, RRF).
search = ["model", "dep:rusqlite", "dep:md5-bow"]
# Provider-agnostic text generation + tool-calling types (model-free).
generation = []
# Catalog selector: relevance ranking + progressive budget-bounded pcx expansion.
progressive = ["search", "generation"]
# Free / local tools: deterministic in-process capabilities (calc, units,
# datetime, encoding, phone, random, timer, timezone, astronomy). Pure-Rust, no
# network — vendored from the open-source faro-core-free crate.
free-tools = [
    "dep:base64", "dep:sha1", "dep:md-5", "dep:sha2", "dep:hex",
    "dep:percent-encoding", "dep:getrandom", "dep:fasteval", "dep:rink-core",
    "dep:phonenumber", "dep:suncalc", "dep:jiff", "dep:holidays", "dep:chrono",
]
# On-device speech-to-text (NVIDIA Parakeet via ONNX Runtime).
stt = ["model", "dep:parakeet-rs"]
# The EmbeddingGemma-300M ONNX embedder for `search` (heavy: ort + tokenizers).
embeddinggemma = ["search", "dep:ort", "dep:tokenizers"]
# In-process llama.cpp generation provider (GGUF weights, Metal/CUDA/Vulkan/CPU).
#
# Non-default on purpose: a consumer who only wants `search` must never inherit
# an inference runtime.
llama-cpp = ["generation", "model", "dep:llama-cpp-2", "dep:cc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- model feature ---
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# --- search feature ---
# Bundled SQLite is compiled with FTS5 enabled — the lexical retriever needs it.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# The bag-of-words embedder's token bucketing. Renamed off its default `md5`
# extern name so it can coexist with the free-tools `md-5` (RustCrypto) hasher,
# which also exposes an `md5` crate name.
md5-bow = { version = "0.7", package = "md5", optional = true }

# --- free-tools feature ---
# All pure-Rust so the on-device SDK cross-compiles unchanged. Kept byte-compatible
# with faro-core/core-free/Cargo.toml (the vendored source is generated from it).
base64 = { version = "0.22", optional = true }
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
percent-encoding = { version = "2", optional = true }
getrandom = { version = "0.2", optional = true }
fasteval = { version = "0.2", optional = true }
rink-core = { version = "0.9.0", features = ["bundle-files"], optional = true }
phonenumber = { version = "0.3.9", optional = true }
suncalc = { version = "0.4.0", optional = true }
jiff = { version = "0.2", optional = true }
holidays = { version = "0.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

# --- stt feature ---
parakeet-rs = { version = "0.3.6", optional = true }

# --- embeddinggemma feature ---
ort = { version = "=2.0.0-rc.12", optional = true }
tokenizers = { version = "0.21", optional = true }

# --- llama-cpp feature ---
# Rust bindings to llama.cpp. GPU backends are selected by the CONSUMER via
# llama-cpp-2's own features (metal / cuda / vulkan), because which accelerator
# to build for is a property of the app's target, not of this crate.
llama-cpp-2 = { version = "0.1.153", optional = true, default-features = true }

# The end-to-end smoke test needs the provider AND multi-GB weights, so it must
# not be built by a default `cargo build --all-targets`. Without this the mirror
# validation fails on an example that cannot compile without the feature, which
# is exactly what happened on the first push.
[[example]]
name = "llama_generate"
required-features = ["llama-cpp"]

# The parity bench against Scope's own cases. Same reason for the gate.
[[example]]
name = "llama_bench"
required-features = ["llama-cpp"]

[[example]]
name = "build_prefix"
required-features = ["llama-cpp"]

# Reproduces the end-of-turn marker leaking into `content`, with and without the
# speculative drafter. Same gate: it builds an engine.
[[example]]
name = "turn_marker"
required-features = ["llama-cpp"]

# Measures what a reload costs after `unload`, which is what makes the desktop's
# idle-unload policy affordable. Same gate.
[[example]]
name = "warm_cycle"
required-features = ["llama-cpp"]
# Regression test for slot isolation: two workloads on one engine must keep
# separate KV caches. Needs an engine, so same gate.
[[example]]
name = "slot_isolation"
required-features = ["llama-cpp"]

# Regression test for the persisted KV prefix's invalidation. A stale restore
# answers fluently and wrongly rather than erroring, so it needs a check that
# reads the answer, not the timings. Same gate.
[[example]]
name = "prefix_invalidation"
required-features = ["llama-cpp"]

# The MULTI-STEP bench: tool call, synthetic result fed back, continue. Every
# other number about this engine describes the first call of a loop the product
# runs eight steps of. Same gate.
[[example]]
name = "multistep_bench"
required-features = ["llama-cpp"]

# Does the persisted prefix survive REPLAYED history and tool results, turn after
# turn, rather than only consecutive fresh questions? Assertion-style. Same gate.
[[example]]
name = "conversation_prefix"
required-features = ["llama-cpp"]

# Prints a template's declared capabilities. Run it before wiring up a new model
# family: `supports_tool_calls = false` means a replayed tool call is dropped,
# which is a silently broken agent loop rather than an error. Same gate.
[[example]]
name = "caps_probe"
required-features = ["llama-cpp"]

# Sweeps n_ubatch values against a prompt corpus to measure prefill throughput.
# Builds an engine, so same gate.
[[example]]
name = "ubatch_sweep"
required-features = ["llama-cpp"]

# Does a free tool ACCEPT the intent the model actually sends it? Every other
# check grades which tool was NAMED and never executes one. Needs free-tools.
[[example]]
name = "free_tool_intents"
required-features = ["free-tools"]

# Prints the free-tool calling contract as JSON so a host generator can embed it
# in a tool description. Needs free-tools.
[[example]]
name = "free_tool_contract"
required-features = ["free-tools"]


[build-dependencies]
# Compiles the chat shim for the `llama-cpp` feature (see build.rs).
cc = { version = "1", optional = true }

[dev-dependencies]
hound = "3"

# The STT transcription example only compiles with the stt feature.
[[example]]
name = "transcribe"
required-features = ["stt"]

# Retrieval-parity conformance suite (lexical + BoW); needs the search backend.
[[test]]
name = "conformance"
required-features = ["search"]

# pcx 0.2 parity against real askfaro-progressive-context builder output.
[[test]]
name = "pcx_fixtures"
required-features = ["progressive"]

# EmbeddingGemma end-to-end test; needs the heavy ONNX embedder.
[[test]]
name = "gemma_e2e"
required-features = ["embeddinggemma"]

# On-device free-tool surface (public re-exports of the vendored slice).
[[test]]
name = "free_tools"
required-features = ["free-tools"]
